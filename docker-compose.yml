version: "3.9"

services:
  backend:
    build: ./backend
    container_name: actual-ielts-backend
    ports:
      - "8081:6000"
    restart: always

  frontend:
    build: ./frontend
    container_name: actual-ielts-frontend
    ports:
      - "130:3000"
    depends_on:
      - backend
    restart: always